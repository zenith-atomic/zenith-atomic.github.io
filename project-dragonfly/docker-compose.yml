version: "3.9"

networks:
  dragonfly-net:
    driver: bridge

volumes:
  questdb-data:
  clickhouse-data:
  qdrant-data:
  neo4j-data:
  dragonfly-data:

services:
  # ============================================================
  # DATA SERVICES
  # ============================================================

  questdb:
    image: questdb/questdb:latest
    container_name: dragonfly-questdb
    ports:
      - "9000:9000"    # HTTP interface
      - "9009:9009"    # Ingestion port
      - "8812:8812"    # PostgreSQL wire protocol
    volumes:
      - questdb-data:/var/lib/questdb
    networks:
      - dragonfly-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: dragonfly-clickhouse
    ports:
      - "18123:8123"    # HTTP interface (mapped to avoid conflict with local)
      - "19000:9000"    # Native client interface (mapped to avoid conflict with local)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - dragonfly-net
    environment:
      CLICKHOUSE_DB: dragonfly
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  nats:
    image: nats:latest
    container_name: dragonfly-nats
    ports:
      - "4222:4222"    # Client connections
      - "8222:8222"    # Monitoring/HTTP
    networks:
      - dragonfly-net
    healthcheck:
      test: ["CMD", "nats-server", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dragonfly-qdrant
    ports:
      - "6333:6333"    # gRPC interface
      - "6334:6334"    # REST interface
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - dragonfly-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:latest
    container_name: dragonfly-neo4j
    ports:
      - "7687:7687"    # Bolt protocol
      - "7474:7474"    # HTTP interface
    volumes:
      - neo4j-data:/data
    networks:
      - dragonfly-net
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "--format", "plain", "-d", "neo4j", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  dragonfly:
    image: redis:7-alpine
    container_name: dragonfly-cache
    ports:
      - "6379:6379"    # Redis-compatible protocol
    volumes:
      - dragonfly-data:/data
    networks:
      - dragonfly-net
    command: >
      redis-server
      --save 60 1
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  # APPLICATION SERVICES
  # ============================================================

  bot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dragonfly-bot
    ports:
      - "8000:8000"    # Optional API/metrics port
    volumes:
      - ./configs:/app/configs
      - ./data_pipeline:/app/data_pipeline
      - ./execution:/app/execution
      - ./strategies:/app/strategies
      - ./risk:/app/risk
      - ./knowledge:/app/knowledge
      - ./logs:/app/logs
    networks:
      - dragonfly-net
    environment:
      # Database URLs
      QUESTDB_HOST: questdb
      QUESTDB_PORT: 9009
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 19000
      CLICKHOUSE_HTTP_PORT: 18123
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379

      # NATS
      NATS_URL: nats://nats:4222

      # Exchange API (passed at runtime via .env or secrets)
      # CCXT exchange keys should be set via config files or env vars

      # Python path
      PYTHONPATH: /app

      # Logging
      LOG_LEVEL: INFO
    depends_on:
      questdb:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dashboard.Dockerfile
    container_name: dragonfly-dashboard
    ports:
      - "5000:5000"    # Flask dashboard
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    networks:
      - dragonfly-net
    environment:
      # Flask config
      FLASK_ENV: production
      FLASK_DEBUG: 0

      # Database connections for dashboard
      QUESTDB_HOST: questdb
      QUESTDB_PORT: 9009
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 19000
      CLICKHOUSE_HTTP_PORT: 18123
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379

      # Bot app connection (for trade data)
      BOT_API_URL: http://bot-app:8000

      # Python path
      PYTHONPATH: /app
    depends_on:
      - bot-app
      - questdb
      - clickhouse
      - dragonfly
    restart: unless-stopped